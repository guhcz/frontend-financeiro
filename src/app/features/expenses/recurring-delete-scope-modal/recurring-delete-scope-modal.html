<app-modal title="Como deseja excluir esta despesa?" (closed)="cancelled.emit()">
  <label class="scope-option">
    <input type="radio" name="delete-scope" [checked]="scope() === 'ONLY_THIS'" (change)="scope.set('ONLY_THIS')" />
    <div>
      <strong>Excluir somente esta despesa</strong>
      <p>Remove apenas o lançamento deste mês.</p>
    </div>
  </label>

  <label class="scope-option">
    <input
      type="radio"
      name="delete-scope"
      [checked]="scope() === 'THIS_AND_FUTURE'"
      (change)="scope.set('THIS_AND_FUTURE')"
    />
    <div>
      <strong>Excluir esta e encerrar as próximas</strong>
      <p>Remove este lançamento e impede que novas despesas sejam geradas.</p>
    </div>
  </label>

  <div class="modal-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="button" class="btn btn-danger" (click)="confirm()">Excluir</button>
  </div>
</app-modal>
