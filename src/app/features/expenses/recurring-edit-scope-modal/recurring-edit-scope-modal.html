<app-modal [title]="title()" (closed)="cancelled.emit()">
  <label class="scope-option">
    <input type="radio" name="edit-scope" [checked]="scope() === 'ONLY_THIS'" (change)="scope.set('ONLY_THIS')" />
    <div>
      <strong>{{ onlyThisLabel() }}</strong>
      <p>{{ onlyThisDescription() }}</p>
    </div>
  </label>

  <label class="scope-option">
    <input
      type="radio"
      name="edit-scope"
      [checked]="scope() === 'THIS_AND_FUTURE'"
      (change)="scope.set('THIS_AND_FUTURE')"
    />
    <div>
      <strong>{{ thisAndFutureLabel() }}</strong>
      <p>{{ thisAndFutureDescription() }}</p>
    </div>
  </label>

  <div class="modal-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="confirm()">Confirmar</button>
  </div>
</app-modal>
