<app-modal
  title="Preferências"
  subtitle="Personalize sua experiência no MeuFinanceiro."
  (closed)="cancel()"
>
  <section class="appearance-card">
    <h3>Aparência</h3>
    <div class="theme-row">
      <div class="theme-copy">
        <strong>Tema</strong>
        <span>Escolha entre o tema claro ou escuro.</span>
      </div>
      <div class="theme-options" role="radiogroup" aria-label="Tema da aplicação">
        <button type="button" [class.active]="selectedTheme() === 'light'" (click)="selectTheme('light')">
          <lucide-icon name="sun" [size]="18"></lucide-icon> Claro
        </button>
        <button type="button" [class.active]="selectedTheme() === 'dark'" (click)="selectTheme('dark')">
          <lucide-icon name="moon" [size]="18"></lucide-icon> Escuro
        </button>
      </div>
    </div>
    <div class="theme-info"><lucide-icon name="info" [size]="18"></lucide-icon>A alteração do tema será aplicada imediatamente em todo o sistema.</div>
  </section>
  <div class="preferences-actions">
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="save()">Salvar</button>
  </div>
</app-modal>
