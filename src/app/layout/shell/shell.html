<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">📊</span>
      <span class="brand-name">MeuFinanceiro</span>
    </div>

    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🏠</span>
        Dashboard
      </a>
      <a routerLink="/movimentacoes" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🧾</span>
        Movimentações
      </a>
      <a routerLink="/limite-mensal" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🎯</span>
        Limite mensal
      </a>
      <a routerLink="/planejamento" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🗓️</span>
        Planejamento
      </a>
      <a routerLink="/cadastros" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🗂️</span>
        Cadastros
      </a>
      <span class="nav-item disabled" title="Em breve">
        <span class="nav-icon">📈</span>
        Gráficos
        <span class="nav-tag">Em breve</span>
      </span>
    </nav>

    <button type="button" class="nav-item logout" (click)="logout()">
      <span class="nav-icon">🚪</span>
      Sair
    </button>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
