<app-modal [title]="title()" (closed)="cancelled.emit()">
  <p>{{ message() }}</p>
  <div class="confirm-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">{{ cancelLabel() }}</button>
    <button type="button" class="btn btn-danger" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
  </div>
</app-modal>
