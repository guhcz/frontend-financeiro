<div class="empty-state">
  <div class="empty-state-icon">
    @if (lucideIcon(); as name) {
      <lucide-icon [name]="name" [size]="28"></lucide-icon>
    } @else {
      {{ icon() }}
    }
  </div>
  <h3>{{ title() }}</h3>
  @if (description()) {
    <p>{{ description() }}</p>
  }
  @if (actionLabel()) {
    <button type="button" class="btn btn-primary" (click)="action.emit()">{{ actionLabel() }}</button>
  }
</div>
