<div class="progress-track" [class.sm]="size() === 'sm'">
  <div
    class="progress-fill"
    [class.violet]="variant() === 'violet' && state() !== 'exceeded'"
    [class.amber]="variant() === 'amber' && state() !== 'exceeded'"
    [class.warning]="variant() === 'auto' && state() === 'warning'"
    [class.reached]="variant() === 'auto' && state() === 'reached'"
    [class.exceeded]="state() === 'exceeded'"
    [style.width.%]="clampedWidth()"
  ></div>
</div>
